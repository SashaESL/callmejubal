<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test - Call Me Jubal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f4f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: white; padding: 40px; border-radius: 20px; max-width: 600px; width: 90%; box-shadow: 0 10px 40px rgba(0,0,0,0.1); text-align: center; }
        h1 { color: #2b6cb0; margin-bottom: 10px; }
        .question { font-size: 1.5rem; margin: 20px 0; color: #2d3748; }
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0; }
        .option { padding: 15px; border: 2px solid #e2e8f0; border-radius: 10px; cursor: pointer; transition: 0.3s; background: white; font-size: 1rem; }
        .option:hover { border-color: #2b6cb0; background: #ebf8ff; }
        .option.correct { border-color: #38a169; background: #f0fff4; }
        .option.wrong { border-color: #e53e3e; background: #fff5f5; }
        .option.disabled { pointer-events: none; opacity: 0.7; }
        .progress { color: #4a5568; margin: 10px 0; }
        .score { font-size: 1.2rem; color: #2d3748; margin: 20px 0; }
        .btn { padding: 12px 30px; border: none; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.3s; margin: 5px; }
        .btn-primary { background: #2b6cb0; color: white; }
        .btn-primary:hover { background: #1a365d; transform: translateY(-2px); }
        .btn-success { background: #38a169; color: white; }
        .btn-success:hover { background: #2f855a; }
        .btn-secondary { background: #a0aec0; color: white; }
        .btn-secondary:hover { background: #718096; }
        .back-link { display: block; margin-top: 20px; color: #2b6cb0; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
        .hidden { display: none; }
        .result { font-size: 2rem; margin: 20px 0; }
        .result-detail { font-size: 1.1rem; color: #4a5568; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Multiple Choice Test</h1>

        <div id="testArea">
            <div class="progress" id="progressText">Question 1 of 10</div>
            <div class="question" id="questionText">Loading...</div>
            <div class="options" id="optionsContainer"></div>
            <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()">Next Question →</button>
        </div>

        <div id="resultArea" class="hidden">
            <div class="result" id="resultEmoji">🎉</div>
            <div class="result-detail" id="resultText">You got 0 out of 0 correct!</div>
            <div class="result-detail" id="resultPercent"></div>
            <button class="btn btn-success" onclick="restartTest()">🔄 Try Again</button>
            <button class="btn btn-secondary" onclick="window.location.href='/study'">📖 Study More</button>
        </div>

        <a href="/" class="back-link">← Back to Home</a>
    </div>

    <script>
        let questions = [];
        let currentQuestion = 0;
        let score = 0;
        let totalQuestions = 0;
        let answered = false;

        // Get questions from the server
        fetch('/api/test-questions')
            .then(response => response.json())
            .then(data => {
                if (data.length === 0) {
                    document.getElementById('questionText').textContent = 'No cards found! Please add some vocabulary first.';
                    document.getElementById('optionsContainer').innerHTML = '';
                    document.getElementById('nextBtn').classList.add('hidden');
                    return;
                }
                questions = data;
                totalQuestions = Math.min(questions.length, 10);
                showQuestion();
            })
            .catch(err => {
                document.getElementById('questionText').textContent = 'Error loading questions. Please try again.';
            });

        function showQuestion() {
            if (currentQuestion >= totalQuestions) {
                showResults();
                return;
            }

            const q = questions[currentQuestion];
            document.getElementById('progressText').textContent = `Question ${currentQuestion + 1} of ${totalQuestions}`;
            document.getElementById('questionText').textContent = q.english;
            document.getElementById('nextBtn').classList.add('hidden');
            answered = false;

            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';

            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option';
                btn.textContent = opt;
                btn.dataset.index = index;
                btn.onclick = () => selectAnswer(index, q.correct);
                container.appendChild(btn);
            });
        }

        function selectAnswer(selected, correct) {
            if (answered) return;
            answered = true;

            const options = document.querySelectorAll('.option');
            options.forEach((btn, index) => {
                btn.classList.add('disabled');
                if (index === correct) {
                    btn.classList.add('correct');
                }
                if (index === selected && selected !== correct) {
                    btn.classList.add('wrong');
                }
            });

            if (selected === correct) {
                score++;
            }

            document.getElementById('nextBtn').classList.remove('hidden');
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < totalQuestions) {
                showQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('testArea').classList.add('hidden');
            document.getElementById('resultArea').classList.remove('hidden');

            const percent = Math.round((score / totalQuestions) * 100);
            let emoji = '😅';
            if (percent >= 90) emoji = '🌟';
            else if (percent >= 70) emoji = '🎉';
            else if (percent >= 50) emoji = '💪';

            document.getElementById('resultEmoji').textContent = emoji;
            document.getElementById('resultText').textContent = `You got ${score} out of ${totalQuestions} correct!`;
            document.getElementById('resultPercent').textContent = `${percent}% — ${percent >= 70 ? 'Great job!' : 'Keep practicing!'}`;
        }

        function restartTest() {
            currentQuestion = 0;
            score = 0;
            document.getElementById('testArea').classList.remove('hidden');
            document.getElementById('resultArea').classList.add('hidden');
            showQuestion();
        }
    </script>
</body>
</html>
