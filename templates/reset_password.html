<!DOCTYPE html>
<html>
<head>
    <title>Reset Password - Call Me Jubal</title>
    <style>
        body { font-family: Arial; text-align: center; padding: 60px; background: #f0f4f8; }
        .container { background: white; padding: 40px; border-radius: 20px; max-width: 400px; margin: auto; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 2px solid #e2e8f0; border-radius: 8px; }
        .btn { padding: 12px 30px; background: #38a169; color: white; border: none; border-radius: 8px; cursor: pointer; }
        .btn:hover { background: #2f855a; }
        .flash { padding: 10px; border-radius: 8px; margin: 10px 0; }
        .flash-success { background: #f0fff4; border: 2px solid #38a169; }
        .flash-danger { background: #fff5f5; border: 2px solid #e53e3e; }
        a { color: #2b6cb0; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔑 Reset Password</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash flash-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="post">
            <input type="password" name="password" placeholder="New password" required>
            <input type="password" name="confirm" placeholder="Confirm new password" required>
            <button type="submit" class="btn">Reset Password</button>
        </form>
        <p style="margin-top: 20px;"><a href="/login">← Back to Login</a></p>
    </div>
</body>
</html>
