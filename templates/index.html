<!DOCTYPE html>
<html>
<head>
    <title>Call Me Jubal - Medical Flashcards</title>
    <style>
        body { font-family: Arial; text-align: center; padding: 50px; background: #f0f4f8; }
        h1 { color: #2b6cb0; }
        .btn { display: inline-block; padding: 15px 30px; background: #2b6cb0; color: white; text-decoration: none; border-radius: 8px; margin: 10px; }
        .btn:hover { background: #1a365d; }
        .btn-success { background: #38a169; }
        .btn-success:hover { background: #2f855a; }
        .btn-warning { background: #ed8936; }
        .btn-warning:hover { background: #dd6b20; }
        .language-selector { margin: 20px 0; }
        .language-selector select { padding: 10px; border-radius: 8px; border: 2px solid #e2e8f0; margin-left: 10px; font-size: 1rem; }
        .language-selector label { font-weight: bold; }
    </style>
</head>
<body>
    <h1>🏥 Call Me Jubal</h1>
    <p>9 Languages • Voice • Bulk Upload</p>

    <!-- Language Selector -->
    <div class="language-selector">
        <label for="languageSelect">🌍 Choose your language:</label>
        <select id="languageSelect" onchange="changeLanguage()">
            <option value="english">🇬🇧 English</option>
            <option value="russian">🇷🇺 Russian</option>
            <option value="spanish">🇪🇸 Spanish</option>
            <option value="arabic">🇸🇦 Arabic</option>
            <option value="french">🇫🇷 French</option>
            <option value="german">🇩🇪 German</option>
            <option value="chinese">🇨🇳 Chinese</option>
            <option value="thai">🇹🇭 Thai</option>
            <option value="filipino">🇵🇭 Filipino</option>
        </select>
    </div>

    <!-- Buttons -->
    <div>
        <a href="/upload" class="btn">📤 Upload CSV</a>
        <a href="/stats" class="btn">📊 Statistics</a>
        <a href="/test" class="btn btn-success">📝 Take a Test</a>
        <a href="/study" class="btn btn-warning">📖 Study</a>
    </div>

    <p style="margin-top: 40px; color: #718096;">Welcome, amazing learners! Ready to grow your brains? 🎉</p>

    <script>
    function changeLanguage() {
        const lang = document.getElementById('languageSelect').value;
        
        fetch('/set-language', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ language: lang })
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                alert('Language updated to ' + lang + '!');
                location.reload();
            }
        })
        .catch(error => console.error('Error:', error));
    }
    </script>
</body>
</html>
